name: husen
description: Local operations management for maintenance, bookings, tasks, and stock.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - docs/icon.png
    - docs/featured.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: docs/icon.png
  adaptive_icon_background: "#F5B027"
  adaptive_icon_foreground: docs/icon.png
  min_sdk_android: 23
